name: Bug report / 问题报告
description: Something in MoonOHOS does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened / 现象
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction / 复现步骤
      description: The smallest moonohos.json, MoonBit function and ArkTS call that show the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: moonohos doctor --json
      render: json
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does it fail? / 失败阶段
      options:
        - init
        - build (MoonBit / codegen)
        - build (CMake / SDK)
        - har / hvigor
        - at runtime on device or emulator
        - other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or emulator, ABI, API level / 设备
      placeholder: Pura 90 Pro emulator, x86_64, API 26
